name: Bug report
description: Something in Rilldown does not work as documented
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first — download
        bugs are often already known for a specific server or file.

        Do not paste cookies, proxy credentials, signing keys, or links that
        require your account.

  - type: input
    id: version
    attributes:
      label: Rilldown version
      description: From the installer filename or Settings, for example `0.1.0`.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform and architecture
      options:
        - Windows x64
        - Windows ARM64
        - Linux x64 (.deb)
        - Linux ARM64 (.deb)
        - Linux x64 (AppImage)
        - Linux ARM64 (AppImage)
        - Built from source
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating system version
      description: For example `Windows 11 23H2` or `Ubuntu 22.04`.
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error text or state the download ended in.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a URL that ...
        2. Set connections to ...
        3. Pause and resume
        4. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste anything the app printed if you launched it from a terminal. The
        `rilldown` command-line engine accepts `RILLDOWN_LOG=debug` and the
        browser bridge accepts `RILLDOWN_HOST_LOG=debug`.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the known limitations in the README for this version.
          required: true
        - label: This report contains no credentials or private download links.
          required: true
