name: Windows build

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "crates/**"
      - "ui/**"
      - "extension/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm --prefix ui ci

      - name: Build and stage the native host
        shell: bash
        run: |
          cargo build --release -p rilldown-native-host --target "${{ matrix.target }}"
          node scripts/prepare-sidecar.mjs release "${{ matrix.target }}"

      - name: Build unsigned installers
        run: npx tauri build --target ${{ matrix.target }} --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        with:
          name: rilldown-windows-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/rilldown-app.exe
            target/${{ matrix.target }}/release/rilldown-native-host*.exe
          if-no-files-found: error
          retention-days: 14
